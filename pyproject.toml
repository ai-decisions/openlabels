[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openlabels-core"
version = "0.1.0"
description = "Open tooling for on-chain address labels: unified label-store schema, OFAC and regulator parsers, VASP-register scrapers, registry builders, and a GraphSense-style TagPack generator."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "AI DECISIONS", email = "opensource@aidecisions.ai" }]
keywords = [
    "blockchain",
    "labels",
    "attribution",
    "compliance",
    "ofac",
    "vasp",
    "tagpack",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = ["pydantic>=2.5", "pyarrow>=15"]

[project.optional-dependencies]
tagpack = ["pyyaml>=6"]
jfsa = ["pdfplumber>=0.11"]
dev = ["pytest>=8", "ruff>=0.4", "pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/ai-decisions/openlabels"
Issues = "https://github.com/ai-decisions/openlabels/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
